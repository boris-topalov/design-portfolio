<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160" role="presentation">
  <!-- Fine neutral film grain, v3. Seamless via stitchTiles; greyscale, alpha
       capped so CSS opacity / blend-mode keeps control. 0.9 KB, no rasters,
       no foreignObject, no external references. -->
  <filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="11" stitchTiles="stitch" result="noise"/>
    <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
    <feComponentTransfer in="mono">
      <feFuncR type="linear" slope="1.2" intercept="-0.08"/>
      <feFuncG type="linear" slope="1.2" intercept="-0.08"/>
      <feFuncB type="linear" slope="1.2" intercept="-0.08"/>
      <feFuncA type="linear" slope="0.55" intercept="0"/>
    </feComponentTransfer>
  </filter>
  <rect width="160" height="160" filter="url(#grain)"/>
</svg>
